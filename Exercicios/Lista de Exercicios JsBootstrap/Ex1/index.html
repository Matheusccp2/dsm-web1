<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Exercicio 1 - Cadastro de Academia</title>
  </head>
  <body>
    <main>
      <h1>Academia Vida Ativa</h1>
      <p>Cadastro de alunos e cálculo de mensalidade</p>
      <form>
        <div class="form-group infoCliente">
          <div class="mb-3 mx-5">
            <label for="nomeAluno" class="form-label">Nome do aluno</label>
            <input
              type="text"
              class="form-control"
              id="nomeAluno"
              aria-describedby="Nome Aluno"
              maxlength="40"
              placeholder="Digite seu nome"
              required
            />
          </div>
          <div class="mb-3 mx-5">
            <label for="idade" class="form-label">Idade</label>
            <input
              type="number"
              class="form-control"
              id="idade"
              placeholder="Informe a idade"
              min="14"
              max="100"
              required
            />
          </div>
        </div>
        <div class="mb-3 mx-5">
          <label for="plano" class="form-label">Plano desejado</label>
          <select class="form-control" id="plano" required>
            <option value="100">Musculação</option>
            <option value="130">Funcional</option>
            <option value="180">Completo</option>
          </select>
        </div>
        <div class="form-group mb-3 mx-5">
          <label class="form-label">Período de treino</label>
          <div class="form-field">
            <input
              type="radio"
              id="periodo-manha"
              class="radio"
              name="fieldGroupRadio"
              required
            />
            <label for="periodo-manha">Manhã</label>
          </div>
          <div class="form-field">
            <input
              type="radio"
              id="periodo-tarde"
              class="radio"
              name="fieldGroupRadio"
              required
            />
            <label for="periodo-tarde">Tarde</label>
          </div>
          <div class="form-field">
            <input
              type="radio"
              id="periodo-noite"
              class="radio"
              name="fieldGroupRadio"
              required
            />
            <label for="periodo-noite">Noite</label>
          </div>
        </div>
        <div class="form-group mb-3 mx-5">
          <label class="form-label">Serviços Adicionais</label>
          <div class="form-field">
            <input
              type="checkbox"
              id="personal-trainer"
              class="check"
              value="80"
            />
            <label for="personal-trainer">Personal Trainer</label>
          </div>
          <div class="form-field">
            <input
              type="checkbox"
              id="avaliacao-fisica"
              class="check"
              value="50"
            />
            <label for="avaliacao-fisica">Avaliação Física</label>
          </div>
        </div>
        <button
          type="button"
          class="btn-solid theme-primary mb-3 mx-5"
          id="btn-calcular"
        >
          Calcular a Mensalidade
        </button>
        <button
          type="button"
          class="btn-solid theme-primary mb-3 mx-5"
          id="btn-limpar"
        >
          Limpar
        </button>

        <div class="mb-3 mx-5">
          <label for="">Tabela dos preços</label>
          <table class="table">
            <tbody>
              <tr>
                <td>Musculação</td>
                <td>R$ 100,00</td>
              </tr>
              <tr>
                <td>Funcional</td>
                <td>R$ 130,00</td>
              </tr>
              <tr>
                <td>Completo</td>
                <td>R$ 180,00</td>
              </tr>
            </tbody>
          </table>
        </div>
      </form>
    </main>
    <script src="app.js"></script>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>

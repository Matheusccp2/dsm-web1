<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="entretenimento, musica, video, foto">

    <link rel="stylesheet" href="style.css">

    <title>Aula 3 - Entretenimento</title>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li>Vídeo</li>
                <li>Música</li>
                <li>Fotos</li>
            </ul>
        </nav>
    </header>
    <main>
        <article id="video">

            <video src="assets/mov_bbb.mp4" controls></video>

            <iframe width="560" height="315" src="https://www.youtube.com/embed/m3MbjxeS5Wc?si=CPxxW3X7Ilr4MO4l" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

        </article>
        <article id="foto">
            <h2>Fotos</h2>
            <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=300&h=300&fit=crop" alt="Imagem aleatória">
        </article>
        <article id="musica">
            <h2>Musicas</h2>
            <audio src="assets/_Space.mp3" controls></audio>
        </article>
    </main>
    <footer>
        <section class="redes-sociais"></section>
        <section class="mapa">
            <details>
                <summary>Endereço da FATEC Votorantim</summary>

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <title>Pet Shop</title>
  </head>
  <body>
    <div class="alert alert-danger">Pet Shop do Zé</div>

    <div id="carouselExample" class="carousel slide">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img
            src="src/images/pexels-daigofotos-32710697.jpg"
            class="d-block w-50"
            alt="..."
          />
        </div>
        <div class="carousel-item">
          <img
            src="src/images/pexels-daigofotos-32710699.jpg"
            class="d-block w-50"
            alt="..."
          />
        </div>
        <div class="carousel-item">
          <img
            src="src/images/pexels-joydeb-biswas-2151744427-38511009.jpg"
            class="d-block w-50"
            alt="..."
          />
        </div>
      </div>
      <button
        class="carousel-control-prev"
        type="button"
        data-bs-target="#carouselExample"
        data-bs-slide="prev"
      >
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button
        class="carousel-control-next"
        type="button"
        data-bs-target="#carouselExample"
        data-bs-slide="next"
      >
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>

    <section>
      <h1>Cadastro de Banho</h1>
      <div class="row">
        <div class="col-6">
          <label for="nome" class="form-label">Nome</label>
          <input type="text" name="nome" id="nome" class="form-control" />
        </div>
        <div class="col-4">
          <label for="raca">Escolha a Raça:</label>
          <select name="racas" id="racas" class="form-select">
            <option selected>Raças</option>
            <optgroup label="Raças Grandes">
              <option value="160">Golden</option>
              <option value="150">Labrador</option>
            </optgroup>
            <optgroup label="Raças Pequenas">
              <option value="100">Shitsu</option>
              <option value="80">Pincher</option>
            </optgroup>
          </select>
        </div>
        <div class="col-2">
          <button class="btn btn-primary" id="orcar">Orçar</button>
        </div>
      </div>
      <div class="row">
        <div class="col-6" id="pacoteMensal">
          <label for="nome" class="form-label">Pacote Mensal</label>
          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="radioDefault"
              id="banho"
              value="300"
            />
            <label class="form-check-label" for="radioDefault1"> Banho </label>
          </div>
          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="radioDefault"
              id="banhoCompleto"
              value="600"
              checked
            />
            <label class="form-check-label" for="radioDefault2">
              Banho Completo
            </label>
          </div>
        </div>
        <div class="col-6">
          <label for="raca">Serviços:</label>
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              value="50"
              id="servBanho"
            />
            <label class="form-check-label" for="checkDefault">
              Banho
            </label>
          </div>
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              value="20"
              id="servDente"
              checked
            />
            <label class="form-check-label" for="checkChecked">
              Escovar Dente
            </label>
          </div>
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              value="10"
              id="servUnha"
              checked
            />
            <label class="form-check-label" for="checkChecked">
              Cortar Unha
            </label>
          </div>
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              value="20"
              id="servTosa"
              checked
            />
            <label class="form-check-label" for="checkChecked">
              Tosa Higiênica
            </label>
          </div>
        </div>
      </div>
    </section>

    <script src="app.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
